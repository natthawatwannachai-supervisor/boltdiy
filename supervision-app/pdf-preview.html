<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>ตัวอย่างรายงาน PDF — เครื่องมือสำหรับนักพัฒนา</title>
    <style>
      body {
        margin: 0;
        font-family: Kanit, sans-serif;
        background: #e0e5ec;
        color: #1f2937;
      }
      header {
        padding: 16px 24px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        font-family: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 14px;
        padding: 10px 18px;
        color: #fff;
        background: linear-gradient(135deg, #10b981, #14b8a6);
        cursor: pointer;
      }
      #status {
        font-size: 13px;
        color: #4b5a70;
      }
      iframe {
        width: 100%;
        height: calc(100vh - 72px);
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>ตัวอย่างรายงาน PDF (ข้อมูลจำลอง)</strong>
      <button id="rebuild" type="button">สร้างใหม่</button>
      <span id="status">กำลังสร้าง...</span>
    </header>
    <iframe id="frame" title="ตัวอย่างรายงาน"></iframe>
    <script type="module" src="/src/dev/pdfPreview.ts"></script>
  </body>
</html>
